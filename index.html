<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>話匣子｜對話卡牌</title>
<script>
try{ var t = localStorage.getItem("huaxiazi-theme"); if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme", t); }catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF1; --surface:#FFFFFF; --ink:#1C2230; --muted:#5A6272; --line:#CDD4DD;
  --light:#8FD3C1; --medium:#F4BC4F; --deep:#3E4396; --any:#2A3140;
  --on-light:#1C2230; --on-medium:#1C2230; --on-deep:#F5F6FA; --on-any:#F5F6FA;
  --danger:#B3261E;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  box-sizing:border-box;
  color-scheme:light dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171D; --surface:#1E232C; --ink:#E8ECF2; --muted:#9AA3B2; --line:#2F3642;
    --light:#6FBFAC; --medium:#E3A83A; --deep:#5A60C0; --any:#3A4252; --danger:#F2B8B5;
  }
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#14171D; --surface:#1E232C; --ink:#E8ECF2; --muted:#9AA3B2; --line:#2F3642;
  --light:#6FBFAC; --medium:#E3A83A; --deep:#5A60C0; --any:#3A4252; --danger:#F2B8B5;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--medium);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 48px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-family:var(--display);font-weight:400;font-size:2.4rem;line-height:1;margin:0;letter-spacing:.04em}
.head-right{display:flex;align-items:center;gap:8px}
.theme-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;color:var(--muted);font-size:.9rem;line-height:1}
.theme-btn .ico{font-size:1.05rem;color:var(--ink)}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border:0;background:none;padding:6px 18px;border-radius:999px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.levels button{border:2px solid transparent;border-radius:14px;padding:10px 4px;background:var(--surface);text-align:center;line-height:1.3}
.levels button b{display:block;font-family:var(--display);font-weight:400;font-size:1.15rem}
.levels button small{color:var(--muted);font-size:.75rem}
.levels button[aria-pressed="true"]{border-color:var(--ink)}
.levels .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:1px}

.toggles{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 18px;color:var(--muted);font-size:.9rem}
.toggles label{display:flex;align-items:center;gap:6px;cursor:pointer}

/* the card */
.stage{perspective:1400px;display:flex;justify-content:center;margin:8px 0 18px}
.card{width:max(210px,min(100%,360px,calc((100svh - 330px) * .714)));aspect-ratio:5/7;container-type:inline-size;position:relative;cursor:pointer;border:0;padding:0;background:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.card .inner,.card .face,.card .face *{pointer-events:none}
.card .inner{position:absolute;inset:0;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 18px 40px -18px rgba(20,24,40,.45)}
.back{display:grid;place-items:center;background:var(--bk,var(--any));color:var(--bk-on,var(--on-any))}
.back::before{content:"";position:absolute;inset:14px;border-radius:14px;border:2px solid currentColor;opacity:.35}
.back .pattern{position:absolute;inset:0;opacity:.14;background-image:radial-gradient(currentColor 2px,transparent 2.5px);background-size:22px 22px}
.back .mark{position:relative;text-align:center}
.back .mark span{display:block;font-family:var(--display);font-size:clamp(2rem,16cqi,3.2rem);line-height:1.1;letter-spacing:.08em}
.back .mark small{opacity:.8}
.front{transform:rotateY(180deg);background:var(--fc,var(--any));color:var(--fc-on,var(--on-any));display:flex;flex-direction:column;padding:22px 24px}
.corner{font-family:var(--display);font-size:1.6rem;line-height:1}
.corner.bottom{align-self:flex-end;transform:rotate(180deg)}
.qtext{flex:1;display:flex;align-items:center;font-family:var(--display);font-size:clamp(1.05rem,7.4cqi,1.75rem);line-height:1.55;overflow-wrap:anywhere;text-align:left}
.badges{display:flex;gap:6px;flex-wrap:wrap;min-height:26px}
.badge{font-size:.78rem;padding:2px 10px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.hint{text-align:center;color:var(--muted);font-size:.9rem;margin:-6px 0 14px;min-height:1.6em}

.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 22px;background:var(--ink);color:var(--bg);font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.88rem;border-radius:10px}
.btn.danger{color:var(--danger);border-color:currentColor}
.btn:disabled{opacity:.45;cursor:not-allowed}

details.rules{margin-top:28px;background:var(--surface);border-radius:16px;padding:14px 18px;border:1px solid var(--line)}
details.rules summary{cursor:pointer;font-weight:500}
details.rules ol{margin:10px 0 0;padding-left:1.3em;color:var(--muted)}

/* manage */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px}
.panel h2{font-size:1.1rem;margin:0 0 12px;font-weight:700}
textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);resize:vertical;min-height:80px}
select{border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--bg)}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:12px 0}
.row label{display:flex;align-items:center;gap:6px}
.status{font-size:.85rem;color:var(--muted);margin:-8px 0 16px}
.notice{font-size:.9rem;padding:10px 14px;border-radius:12px;background:var(--bg);margin-bottom:14px}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:8px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .bar{width:8px;align-self:stretch;border-radius:4px}
.list .t{overflow-wrap:anywhere}
.list .meta{font-size:.8rem;color:var(--muted)}
.list .ops{display:flex;gap:6px}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.io{display:none;margin-top:12px}
.io.open{display:block}

@media (max-width:480px){
  h1{font-size:2rem}
  .wrap{padding-top:14px}
  header{margin-bottom:14px}
  .theme-btn .lbl{display:none}
  .theme-btn{padding:8px 11px}
  .levels button small{display:none}
  .list li{grid-template-columns:6px 1fr}
  .list .ops{grid-column:2}
}
@media (prefers-reduced-motion: reduce){
  .card .inner{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>話匣子</h1>
    <div class="head-right">
      <button class="theme-btn" id="theme-btn" type="button"><span class="ico" id="theme-ico" aria-hidden="true">◐</span><span class="lbl" id="theme-lbl">跟隨系統</span></button>
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-play" aria-selected="true">抽牌</button>
        <button role="tab" id="tab-manage" aria-selected="false">題庫</button>
      </div>
    </div>
  </header>

  <!-- PLAY -->
  <section id="view-play">
    <div class="levels" id="levels"></div>
    <div class="toggles">
      <label><input type="checkbox" id="only-humor"> 只抽幽默題 ★</label>
      <label><input type="checkbox" id="only-guess"> 只抽猜猜看</label>
    </div>

    <div class="stage">
      <button class="card" id="card" aria-live="polite" aria-label="抽一張牌">
        <div class="inner">
          <div class="face back" id="back">
            <div class="pattern"></div>
            <div class="mark"><span>話匣子</span><small id="back-label">隨機</small></div>
          </div>
          <div class="face front" id="front">
            <div class="corner" id="corner-top"></div>
            <div class="qtext" id="qtext"></div>
            <div class="badges" id="badges"></div>
            <div class="corner bottom" id="corner-bottom"></div>
          </div>
        </div>
      </button>
    </div>
    <p class="hint" id="hint">點牌或按「抽一張」開始</p>
    <div class="actions">
      <button class="btn" id="draw">抽一張</button>
      <button class="btn ghost" id="shuffle">重新洗牌</button>
    </div>

    <details class="rules">
      <summary>建議玩法</summary>
      <ol>
        <li>從輕度開始，聊熱了再往中度、深度走。</li>
        <li>抽牌的人先問，問完自己也要回答同一題。</li>
        <li>任何人都可以說「跳過」，不需要解釋。</li>
        <li>猜猜看卡：先猜對方的答案，再請他公布。老朋友玩特別有趣。</li>
        <li>深度題聊得太沉時，可以切回輕度，勾選「只抽幽默題」抽幾張，讓氣氛輕鬆一下。</li>
      </ol>
    </details>
  </section>

  <!-- MANAGE -->
  <section id="view-manage" hidden>
    <p class="status" id="status">載入題庫中…</p>
    <div class="notice" id="ro-notice" hidden>這份題庫目前是唯讀的，你可以抽牌，但無法新增或修改題目。</div>

    <div class="panel" id="editor">
      <h2 id="editor-title">新增題目</h2>
      <textarea id="f-text" placeholder="例如：你最近一次熬夜是為了什麼？" maxlength="200"></textarea>
      <div class="row">
        <select id="f-level" aria-label="層級">
          <option value="light">輕度</option>
          <option value="medium">中度</option>
          <option value="deep">深度</option>
        </select>
        <label><input type="checkbox" id="f-humor"> 幽默 ★</label>
        <label><input type="checkbox" id="f-guess"> 猜猜看</label>
      </div>
      <div class="actions" style="justify-content:flex-start">
        <button class="btn" id="f-save">新增題目</button>
        <button class="btn ghost" id="f-cancel" hidden>取消</button>
      </div>
      <p class="hint" id="f-msg" style="text-align:left;margin:10px 0 0"></p>
    </div>

    <div class="panel">
      <div class="row" style="margin-top:0;justify-content:space-between">
        <h2 style="margin:0" id="list-title">題目</h2>
        <select id="list-filter" aria-label="篩選層級">
          <option value="all">全部層級</option>
          <option value="light">輕度</option>
          <option value="medium">中度</option>
          <option value="deep">深度</option>
        </select>
      </div>
      <ul class="list" id="list"></ul>
    </div>

    <div class="panel">
      <h2>備份與匯入</h2>
      <p class="meta" style="color:var(--muted);margin:0 0 10px;font-size:.9rem">匯出成文字可以備份或分享給朋友；貼上別人的題庫文字即可匯入（會加在現有題目之後）。</p>
      <div class="actions" style="justify-content:flex-start">
        <button class="btn ghost small" id="btn-export">匯出題庫</button>
        <button class="btn ghost small" id="btn-import">匯入題目</button>
      </div>
      <div class="io" id="export-box">
        <textarea id="export-text" readonly rows="6"></textarea>
        <div class="actions" style="justify-content:flex-start;margin-top:8px">
          <button class="btn small" id="btn-copy">複製</button>
        </div>
      </div>
      <div class="io" id="import-box">
        <textarea id="import-text" rows="6" placeholder='[{"text":"題目內容","level":"light","humor":false,"guess":false}]'></textarea>
        <div class="actions" style="justify-content:flex-start;margin-top:8px">
          <button class="btn small" id="btn-do-import">匯入</button>
        </div>
      </div>
      <p class="hint" id="io-msg" style="text-align:left;margin:10px 0 0"></p>
    </div>
  </section>
</div>

const LS_KEY = "huaxiazi-questions-v2", LS_OLD = "huaxiazi-questions-v1";
const $ = id => document.getElementById(id);

let questions = [];
let mode = "loading";   // loading | db | local
let db = null, readOnly = false;
let level = "all", onlyHumor = false, onlyGuess = false;
let drawn = new Set(), current = null, flipped = false, lockUntil = 0, flipTimer = null;
let editingId = null, pendingDelete = null;

/* ---------- storage ---------- */
function lsLoad(){
  try{ const v = localStorage.getItem(LS_KEY); if(v){ const a = JSON.parse(v); if(Array.isArray(a)) return a; } }catch(e){}
  let list = STARTER.map(q=>({...q}));
  // keep questions added in the older version of this file
  try{
    const o = JSON.parse(localStorage.getItem(LS_OLD) || "null");
    if(Array.isArray(o)){
      const texts = new Set(list.map(q=>q.text));
      for(const q of o){ if(q && q.text && !texts.has(q.text)){ list.push(q); texts.add(q.text); } }
    }
  }catch(e){}
  try{ localStorage.setItem(LS_KEY, JSON.stringify(list)); }catch(e){}
  return list;
}
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(questions)); }catch(e){} }

function useLocal(){
  mode = "local"; questions = lsLoad(); onData();
}

async function init(){
  renderLevels(); renderCardBack();
  if(!window.claude || typeof window.claude.use !== "function"){ useLocal(); return; }
  let handle = null;
  try{ handle = await window.claude.use("db"); }catch(e){}
  if(!handle){ useLocal(); return; }
  db = handle; mode = "db";
  db.collection("questions").onSnapshot(snap=>{
    questions = snap.docs.map(d=>({id:d.id, ...d.data()}));
    onData();
  }, err=>{ if(!questions.length) useLocal(); });
}

async function saveQuestion(q){
  if(mode === "db"){
    const {id, ...data} = q;
    try{ await db.collection("questions").doc(id).set(data); return true; }
    catch(e){ handleWriteError(e); return false; }
  }
  const i = questions.findIndex(x=>x.id===q.id);
  if(i>=0) questions[i] = q; else questions.push(q);
  lsSave(); onData(); return true;
}
async function removeQuestion(id){
  if(mode === "db"){
    try{ await db.collection("questions").doc(id).delete(); return true; }
    catch(e){ handleWriteError(e); return false; }
  }
  questions = questions.filter(q=>q.id!==id); lsSave(); onData(); return true;
}
function handleWriteError(e){
  const code = e && e.code;
  if(code === "not_granted" || code === "revoked"){ readOnly = true; renderManage(); }
  else { $("f-msg").textContent = "沒有存成功，請稍後再試一次。"; }
}
const newId = () => "q" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* ---------- play ---------- */
function renderLevels(){
  const box = $("levels"); box.innerHTML = "";
  const opts = [["all","隨機","三種混合","any"], ...Object.entries(LEVELS).map(([k,v])=>[k,v.name,v.hint,k])];
  for(const [k,name,hint,color] of opts){
    const b = document.createElement("button");
    b.setAttribute("aria-pressed", String(level===k));
    const sw = document.createElement("span"); sw.className="sw"; sw.style.background = `var(--${color})`;
    const t = document.createElement("b"); t.append(sw, name);
    const s = document.createElement("small"); s.textContent = hint;
    b.append(t, s);
    b.onclick = () => { level = k; renderLevels(); resetDeck(); };
    box.append(b);
  }
}
function pool(){
  return questions.filter(q => (level==="all" || q.level===level) && (!onlyHumor || q.humor) && (!onlyGuess || q.guess));
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function resetDeck(){
  clearTimeout(flipTimer); lockUntil = 0;
  drawn = new Set();
  current = null;
  if(flipped){ flipped=false; $("card").classList.remove("flipped"); }
  renderCardBack(); updateHint();
}
function remaining(){
  const ids = new Set(pool().map(q=>q.id));
  return pool().filter(q=>valid(q) && !drawn.has(q.id)).length;
}
function updateHint(){
  const p = pool().length;
  if(mode==="loading"){ $("hint").textContent = "載入題庫中…"; $("draw").disabled = true; return; }
  if(!p){ $("hint").textContent = "這個組合沒有題目，換個層級或到「題庫」新增吧"; $("draw").disabled = true; return; }
  $("draw").disabled = false;
  $("draw").textContent = current ? "下一張" : "抽一張";
  const r = remaining();
  $("hint").textContent = current ? (r ? `這一輪還剩 ${r} 張` : "這一輪抽完了，下一張會重新洗牌") : `共 ${p} 張，點牌或按「抽一張」開始`;
}
function renderCardBack(){
  const c = level==="all" ? "any" : level;
  const back = $("back");
  back.style.setProperty("--bk", `var(--${c})`);
  back.style.setProperty("--bk-on", `var(--on-${c})`);
  $("back-label").textContent = level==="all" ? "隨機" : LEVELS[level].name;
}
function fillFront(q){
  const f = $("front");
  f.style.setProperty("--fc", `var(--${q.level})`);
  f.style.setProperty("--fc-on", `var(--on-${q.level})`);
  $("corner-top").textContent = LEVELS[q.level].short;
  $("corner-bottom").textContent = LEVELS[q.level].short;
  $("qtext").textContent = q.text;
  const b = $("badges"); b.innerHTML = "";
  const add = t => { const s=document.createElement("span"); s.className="badge"; s.textContent=t; b.append(s); };
  add(LEVELS[q.level].name);
  if(q.humor) add("★ 幽默");
  if(q.guess) add("猜猜看");
}
const reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function valid(q){ return q && typeof q.text==="string" && LEVELS[q.level]; }
function draw(){
  const now = Date.now();
  if(now < lockUntil) return;              // ignore double taps during the flip
  const ids = new Set(pool().filter(valid).map(q=>q.id));
  if(!ids.size){ updateHint(); return; }
  let left = [...ids].filter(id=>!drawn.has(id));
  if(!left.length){                        // round finished: start a new one
    drawn = new Set();
    left = [...ids].filter(id=>id!==current);
    if(!left.length) left = [...ids];
  }
  const pick = left[Math.floor(Math.random()*left.length)];
  drawn.add(pick);
  const q = questions.find(x=>x.id===pick);
  if(!valid(q)){ updateHint(); return; }
  const card = $("card");
  const reveal = () => {
    try{ current = q.id; fillFront(q); }
    finally{ flipped = true; card.classList.add("flipped"); updateHint(); }
  };
  clearTimeout(flipTimer);
  if(flipped && !reduced()){
    lockUntil = now + 450;
    card.classList.remove("flipped"); flipped = false;
    flipTimer = setTimeout(reveal, 420);
  } else {
    lockUntil = now + 150;
    reveal();
  }
}

/* ---------- manage ---------- */
function renderManage(){
  const st = $("status");
  st.textContent = mode==="db" ? `共 ${questions.length} 題，改動會自動存到這個頁面，分享給朋友也看得到。`
                 : mode==="local" ? `共 ${questions.length} 題，存在這台裝置的瀏覽器裡。` : "載入題庫中…";
  $("ro-notice").hidden = !readOnly;
  for(const id of ["f-text","f-level","f-humor","f-guess","f-save","btn-import","btn-do-import"]) $(id).disabled = readOnly;
  const filter = $("list-filter").value;
  const items = questions.filter(q=>filter==="all"||q.level===filter)
    .sort((a,b)=>["light","medium","deep"].indexOf(a.level)-["light","medium","deep"].indexOf(b.level) || (a.createdAt||0)-(b.createdAt||0));
  $("list-title").textContent = `題目（${items.length}）`;
  const ul = $("list"); ul.innerHTML = "";
  if(!items.length){ const li=document.createElement("li"); li.className="empty"; li.style.display="block"; li.textContent="這裡還沒有題目，從上面新增第一題吧。"; ul.append(li); return; }
  for(const q of items){
    const li = document.createElement("li");
    const bar = document.createElement("span"); bar.className="bar"; bar.style.background=`var(--${q.level})`;
    const body = document.createElement("div");
    const t = document.createElement("div"); t.className="t"; t.textContent = q.text;
    const m = document.createElement("div"); m.className="meta";
    m.textContent = [LEVELS[q.level].name, q.humor?"★ 幽默":"", q.guess?"猜猜看":""].filter(Boolean).join("，");
    body.append(t,m);
    const ops = document.createElement("div"); ops.className="ops";
    if(!readOnly){
      const e = document.createElement("button"); e.className="btn ghost small"; e.textContent="編輯"; e.onclick=()=>startEdit(q);
      const d = document.createElement("button"); d.className="btn ghost small danger";
      d.textContent = pendingDelete===q.id ? "確定刪除" : "刪除";
      d.onclick = async ()=>{
        if(pendingDelete!==q.id){ pendingDelete=q.id; renderManage(); return; }
        pendingDelete=null; if(editingId===q.id) stopEdit(); await removeQuestion(q.id);
      };
      ops.append(e,d);
    }
    li.append(bar,body,ops); ul.append(li);
  }
}
function startEdit(q){
  editingId = q.id;
  $("editor-title").textContent = "修改題目";
  $("f-text").value = q.text; $("f-level").value = q.level;
  $("f-humor").checked = !!q.humor; $("f-guess").checked = !!q.guess;
  $("f-save").textContent = "儲存修改"; $("f-cancel").hidden = false; $("f-msg").textContent = "";
  $("editor").scrollIntoView({behavior: reduced()?"auto":"smooth", block:"start"});
  $("f-text").focus();
}
function stopEdit(){
  editingId = null;
  $("editor-title").textContent = "新增題目";
  $("f-text").value = ""; $("f-humor").checked = false; $("f-guess").checked = false;
  $("f-save").textContent = "新增題目"; $("f-cancel").hidden = true;
}
async function submit(){
  const text = $("f-text").value.trim();
  if(!text){ $("f-msg").textContent = "先寫下題目內容。"; $("f-text").focus(); return; }
  const base = editingId ? questions.find(q=>q.id===editingId) : null;
  const q = { id: editingId || newId(), text, level: $("f-level").value,
    humor: $("f-humor").checked, guess: $("f-guess").checked,
    createdAt: base ? (base.createdAt||0) : Date.now() };
  const wasEdit = !!editingId;
  $("f-save").disabled = true;
  const ok = await saveQuestion(q);
  $("f-save").disabled = readOnly;
  if(ok){ stopEdit(); $("f-msg").textContent = wasEdit ? "已儲存修改。" : `已新增到${LEVELS[q.level].name}。`; }
}

/* export / import */
function toggleBox(id){ for(const b of ["export-box","import-box"]) $(b).classList.toggle("open", b===id && !$(b).classList.contains("open")); $("io-msg").textContent=""; }
function doExport(){
  const data = questions.map(({text,level,humor,guess})=>({text,level,humor:!!humor,guess:!!guess}));
  $("export-text").value = JSON.stringify(data, null, 1);
  toggleBox("export-box");
}
async function doCopy(){
  const ta = $("export-text");
  try{ await navigator.clipboard.writeText(ta.value); $("io-msg").textContent = "已複製。"; }
  catch(e){ ta.focus(); ta.select(); $("io-msg").textContent = "已全選，請手動複製。"; }
}
async function doImport(){
  let arr;
  try{ arr = JSON.parse($("import-text").value); }catch(e){ $("io-msg").textContent = "格式看不懂，請貼上從「匯出題庫」複製的文字。"; return; }
  if(!Array.isArray(arr)){ $("io-msg").textContent = "格式看不懂，請貼上從「匯出題庫」複製的文字。"; return; }
  const existing = new Set(questions.map(q=>q.text));
  const valid = arr.filter(x=>x && typeof x.text==="string" && x.text.trim() && LEVELS[x.level] && !existing.has(x.text.trim()));
  if(!valid.length){ $("io-msg").textContent = "沒有可以匯入的新題目（重複的題目會自動略過）。"; return; }
  $("btn-do-import").disabled = true;
  let n = 0;
  for(const x of valid){
    const ok = await saveQuestion({id:newId(), text:x.text.trim().slice(0,200), level:x.level, humor:!!x.humor, guess:!!x.guess, createdAt:Date.now()+n});
    if(!ok) break; n++;
  }
  $("btn-do-import").disabled = readOnly;
  $("io-msg").textContent = `已匯入 ${n} 題。`;
  if(n){ $("import-text").value = ""; }
}

/* ---------- theme ---------- */
const THEME_KEY = "huaxiazi-theme";
const THEMES = [
  {id:"system", ico:"◐", name:"跟隨系統"},
  {id:"light",  ico:"☀", name:"淺色"},
  {id:"dark",   ico:"☾", name:"深色"},
];
let theme = "system";
try{ const t = localStorage.getItem(THEME_KEY); if(t==="light"||t==="dark") theme = t; }catch(e){}
function applyTheme(){
  const root = document.documentElement;
  if(theme==="system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", theme);
  const t = THEMES.find(x=>x.id===theme);
  const next = THEMES[(THEMES.indexOf(t)+1) % THEMES.length];
  $("theme-ico").textContent = t.ico;
  $("theme-lbl").textContent = t.name;
  $("theme-btn").setAttribute("aria-label", `外觀：${t.name}，點一下切換成${next.name}`);
  $("theme-btn").title = `外觀：${t.name}（點一下切換成${next.name}）`;
}
$("theme-btn").onclick = () => {
  const i = THEMES.findIndex(x=>x.id===theme);
  theme = THEMES[(i+1) % THEMES.length].id;
  try{ if(theme==="system") localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, theme); }catch(e){}
  applyTheme();
};
applyTheme();

/* ---------- wiring ---------- */
function onData(){ renderManage(); updateHint(); }
function showTab(which){
  const play = which==="play";
  $("tab-play").setAttribute("aria-selected", String(play));
  $("tab-manage").setAttribute("aria-selected", String(!play));
  $("view-play").hidden = !play; $("view-manage").hidden = play;
  if(play) updateHint(); else renderManage();
}
$("tab-play").onclick = ()=>showTab("play");
$("tab-manage").onclick = ()=>showTab("manage");

init();
